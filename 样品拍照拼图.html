<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="样品拼图">
    <meta name="theme-color" content="#f4f1ea">
    
    
    <title>样品拍照拼图</title>
    
<style>
/* 中性风：米灰底、鼠尾草绿，大按钮拉开间距 */
:root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #3e3a36;
    --muted: #7a746c;
    --accent: #6b8f71;
    --ok: #5d7f7a;
    --line: #e4dfd6;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background-color: #f4f1ea;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Noto Sans SC", sans-serif;
}

body {
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 18px 36px;
    position: relative;
}

.dock {
    position: sticky;
    top: 0;
    z-index: 8;
    background: #f4f1ea;
    padding-bottom: 8px;
}

.top-row {
    display: flex;
    align-items: center;
    gap: 14px;
}

.top-row > div:first-child {
    flex: 1;
}

.progress-side {
    width: 10px;
    height: 56px;
    border-radius: 99px;
    background: #e4dfd6;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

.progress-side i {
    display: block;
    width: 100%;
    height: 0;
    border-radius: 99px;
    background: #6b8f71;
}

.banner {
    padding: 12px 14px;
    border-radius: 16px;
    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.45;
}

.banner-warn {
    background: #efe8dc;
    color: #6a5048;
}

.banner-info {
    background: #e6eef0;
    color: #4d6468;
}

.top {
    margin: 8px 0 22px;
}

h1 {
    font-size: 28px;
    margin: 0 0 8px;
    font-weight: 600;
}

.status,
.hint {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    margin: 0;
}

.progress {
    margin-top: 14px;
    height: 10px;
    border-radius: 99px;
    background: #e4dfd6;
    overflow: hidden;
}

.progress i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: #6b8f71;
}

.hero-btns {
    display: flex;
    flex-direction: row;
    gap: 12px;
    margin: 0 0 12px;
}

.btn-row {
    display: flex;
    gap: 12px;
    margin: 0 0 10px;
}

.file-btn,
button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 56px;
    border: 0;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    background: var(--card);
    touch-action: manipulation;
}

.file-btn {
    position: relative;
    overflow: hidden;
    cursor: pointer;
}

.file-btn input {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    opacity: 0;
    font-size: 16px;
    cursor: pointer;
    z-index: 2;
}

button:disabled {
    opacity: 0.4;
}

.btn-main {
    color: #fff;
    background: #6b8f71;
    flex: 1;
}

.file-btn-sub {
    background: #fff;
    border: 1px solid #d7d1c7;
    flex: 1;
}

.btn-ok {
    color: #fff;
    background: #5d7f7a;
    flex: 1;
}

.btn-ghost {
    flex: 1;
    background: #fff;
    border: 1px solid #d7d1c7;
}

.thumb-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.thumb-card {
    position: relative;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e4dfd6;
}

.thumb-card img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    pointer-events: none;
}

.thumb-cap {
    font-size: 12px;
    padding: 8px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.thumb-del {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 28px;
    min-height: 28px;
    padding: 0;
    font-size: 18px;
    line-height: 1;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: none;
}

.editor-canvas-host {
    margin-top: 6px;
}

#editorCanvas {
    max-height: 46vh;
}

.editor-tools,
.color-row,
.text-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 0 0 14px;
}

.editor-tools button {
    flex: 1 1 22%;
    min-height: 52px;
    font-size: 16px;
    box-shadow: none;
    border: 1px solid #d7d1c7;
}

.text-row input {
    flex: 1 1 160px;
    min-height: 56px;
    border-radius: 10px;
    border: 1px solid #d7d1c7;
    background: #fff;
    color: var(--text);
    font-size: 18px;
    padding: 0 14px;
}

.text-row.is-disabled {
    opacity: 0.45;
}

.editor-wrap {
    background: #fff;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    overflow: auto;
    touch-action: none;
    border: 1px solid #e4dfd6;
}

#editorCanvas {
    display: block;
    max-width: 100%;
}

.is-active {
    outline: 2px solid #6b8f71;
}

.color-dot {
    width: 42px;
    min-height: 42px;
    border-radius: 50%;
    padding: 0;
    box-shadow: none;
    border: 3px solid #fff;
}

.sticky-actions {
    margin-top: 16px;
}

.collage-preview {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 70vh;
    object-fit: contain;
    margin: 0 auto;
    border-radius: 18px;
    background: #fff;
}

.save-sheet {
    position: fixed;
    inset: 0;
    background: rgba(244, 241, 234, 0.96);
    padding: 18px 16px;
    overflow: auto;
    z-index: 20;
}

.toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: #3e3a36;
    color: #fff;
    padding: 12px 18px;
    border-radius: 999px;
    font-size: 15px;
    z-index: 30;
    white-space: nowrap;
}

[hidden] {
    display: none !important;
}

</style>
</head>
<body>
    <div id="wechatBar" class="banner banner-warn" hidden>
        请勿在微信内拍照。苹果选「在 Safari 中打开」，安卓用百度浏览器。
    </div>
    <div id="chromeBar" class="banner banner-warn" hidden>
        请改用百度、夸克或手机自带浏览器，不要用 Chrome。
    </div>
    <div id="iosBar" class="banner banner-info" hidden>
        点底部分享 → 添加到主屏幕，以后直接从桌面打开。
    </div>

    <div class="dock">
        <header class="top">
            <div class="top-row">
                <div>
                    <h1>样品拼图</h1>
                    <p id="statusText" class="status">本批 0 / 9</p>
                </div>
                <div id="progressBar" class="progress-side" aria-hidden="true"><i id="progressFill"></i></div>
            </div>
        </header>

        <section id="homeView">
            <div class="hero-btns">
                <label class="btn-main file-btn">
                    拍照
                    <input id="fileShot" type="file" accept="image/*" capture="environment">
                </label>
                <label class="file-btn file-btn-sub">
                    相册多选
                    <input id="fileAlbum" type="file" accept="image/*" multiple>
                </label>
            </div>
            <div class="btn-row">
                <button id="btnEarlyCollage" class="btn-ghost" type="button" disabled>拼图</button>
                <button id="btnClear" class="btn-ghost" type="button">清空</button>
            </div>
        </section>

        <section id="editorView" hidden>
            <div class="text-row">
                <input id="textInput" type="text" inputmode="text" placeholder="型号，例如 20X-E1">
            </div>
            <div class="editor-tools">
                <button id="toolText" data-tool="text" type="button">文字</button>
                <button id="toolArrow" data-tool="arrow" type="button">箭头</button>
                <button id="toolCircle" data-tool="circle" type="button">圆圈</button>
                <button id="btnUndo" type="button">撤销</button>
            </div>
            <div id="colorRow" class="color-row">
                <button class="color-dot is-active" data-color="#ff4d4f" style="background:#ff4d4f" type="button"></button>
                <button class="color-dot" data-color="#ffffff" style="background:#ffffff" type="button"></button>
                <button class="color-dot" data-color="#ffd666" style="background:#ffd666" type="button"></button>
            </div>
            <div class="btn-row sticky-actions">
                <button id="btnSaveEdit" class="btn-ok" type="button">完成</button>
                <button id="btnCancelEdit" class="btn-ghost" type="button">跳过</button>
            </div>
        </section>
    </div>

    <section id="homeThumbs">
        <div id="thumbList" class="thumb-list"></div>
    </section>

    <div id="editorCanvasHost" class="editor-canvas-host" hidden>
        <div class="editor-wrap">
            <canvas id="editorCanvas"></canvas>
        </div>
    </div>

    <section id="collageView" hidden>
        <div class="btn-row">
            <button id="btnSaveCollage" class="btn-ok" type="button">保存拼图</button>
            <button id="btnBackHome" class="btn-ghost" type="button">返回</button>
        </div>
        <p id="collageCount" class="status">本页 0 张</p>
        <img id="collagePreview" class="collage-preview" alt="拼图预览">
    </section>

    <div id="saveSheet" class="save-sheet" hidden>
        <p id="saveSheetHint" class="hint"></p>
        <img id="saveSheetImg" class="collage-preview" alt="待保存图片">
        <div class="btn-row">
            <button id="btnCloseSheet" class="btn-ok" type="button">关闭</button>
        </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script>
/**
 * 车间拍照拼图：全局配置
 * 改这里即可调整画质、批次、颜色，不必翻业务代码。
 */
window.APP_CONFIG = {
    /** 满几张自动拼一张 3×3 */
    BATCH_SIZE: 9,

    /** 单张导出 JPEG 质量，0~1。略降可明显减小体积，车间看缺陷仍够用 */
    JPEG_QUALITY: 0.72,

    /**
     * 单张照片最长边上限（像素）。读入后立刻缩到这个边长，再进标注和本地库。
     * 手机原图常见 4000 边，解码要占几十 MB；缩到 1280 后大约只剩原来的 1/10。
     * 想更清晰就改大（例如 1600），想更省内存就改小（例如 1024）。
     */
    PHOTO_MAX_EDGE: 1280,

    /**
     * 拼图每格最长边上限。内存不够时拼图流程会再自动往下降。
     */
    COLLAGE_CELL_MAX: 1600,

    /** 拼图格子缝隙（像素） */
    COLLAGE_GAP: 16,

    /** 拼图空白格 / 背景色 */
    COLLAGE_BG: "#111111",

    /** 标注默认颜色（和现场红笔圈缺陷一致） */
    DEFAULT_COLOR: "#e53935",

    /** 文字相对原图宽度的比例 */
    TEXT_SIZE_RATIO: 0.048,

    /** 线条相对原图宽度的比例 */
    LINE_WIDTH_RATIO: 0.0045,

    /** IndexedDB 库名 */
    DB_NAME: "wafer-photo-collage",
    DB_VERSION: 1,

    /** 记住当前未完成批次，闪退后还能接上 */
    BATCH_KEY: "wafer-open-batch-id",
};

/**
 * 用 IndexedDB 保存本批次标注图。关掉浏览器、过半小时再来，图还在。
 * 只存已经「完成标注」的图。只有点「清空」才整批删除。
 */
(function (global) {
    const CONFIG = global.APP_CONFIG;
    const STORE = "photos";
    const MANIFEST_KEY = CONFIG.BATCH_KEY + "-n";
    /** 本页临时备份。不能代替本地库，关掉页面就会没 */
    const memoryRows = [];
    /** 这次没写进本地库，关掉会丢，界面要提醒 */
    let persistWeak = false;

    /**
     * 打开（或创建）本地数据库。每次都试，不因为一次失败就放弃。
     * @returns {Promise<IDBDatabase>}
     */
    function openDb() {
        return new Promise(function (resolve, reject) {
            if (!window.indexedDB) {
                reject(new Error("浏览器没有本地库"));
                return;
            }
            const request = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
            request.onerror = function () {
                reject(request.error || new Error("打开本地缓存失败"));
            };
            request.onblocked = function () {
                reject(new Error("本地库被占用"));
            };
            request.onsuccess = function () {
                resolve(request.result);
            };
            request.onupgradeneeded = function (event) {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(STORE)) {
                    const store = db.createObjectStore(STORE, { keyPath: "id" });
                    store.createIndex("createdAt", "createdAt", { unique: false });
                    store.createIndex("batchId", "batchId", { unique: false });
                }
            };
        });
    }

    /**
     * 向浏览器申请「不要自动清掉这个网页的缓存」。
     * @returns {Promise<boolean>}
     */
    function requestPersist() {
        try {
            if (navigator.storage && navigator.storage.persist) {
                return navigator.storage.persist().catch(function () {
                    return false;
                });
            }
        } catch (err) {
            // 旧浏览器没有这个接口
        }
        return Promise.resolve(false);
    }

    /**
     * 生成当前批次编号（按日期，方便对账）。
     * @returns {string}
     */
    function makeBatchId() {
        const now = new Date();
        const pad = function (n) {
            return String(n).padStart(2, "0");
        };
        return (
            now.getFullYear() +
            pad(now.getMonth() + 1) +
            pad(now.getDate()) +
            "-" +
            pad(now.getHours()) +
            pad(now.getMinutes())
        );
    }

    /**
     * 未拼完单图张数，写在 localStorage，用来发现「库被清掉了」。
     * @param {Array} photos
     */
    function writeManifest(photos) {
        try {
            const n = (photos || []).filter(function (item) {
                return !item.isCollage;
            }).length;
            localStorage.setItem(MANIFEST_KEY, String(n));
        } catch (err) {
            // 无痕模式可能写不了
        }
    }

    /**
     * 上次记住的单图张数。读不到当 0。
     * @returns {number}
     */
    function readManifestCount() {
        try {
            return parseInt(localStorage.getItem(MANIFEST_KEY) || "0", 10) || 0;
        } catch (err) {
            return 0;
        }
    }

    /**
     * 本页内存里也留一份，仅供本地库暂时打不开时顶上。
     * @param {Object} photo
     */
    function rememberInRam(photo) {
        let found = false;
        for (let i = 0; i < memoryRows.length; i += 1) {
            if (memoryRows[i].id === photo.id) {
                memoryRows[i] = photo;
                found = true;
                break;
            }
        }
        if (!found) {
            memoryRows.push(photo);
        }
    }

    function sortByTime(rows) {
        const list = (rows || []).slice();
        list.sort(function (a, b) {
            return (a.createdAt || 0) - (b.createdAt || 0);
        });
        return list;
    }

    /**
     * 从已打开的库读出全部照片。
     * @param {IDBDatabase} db
     * @returns {Promise<Array>}
     */
    function readAllFromDb(db) {
        return new Promise(function (resolve, reject) {
            const tx = db.transaction(STORE, "readonly");
            const rows = [];
            const request = tx.objectStore(STORE).openCursor();
            request.onsuccess = function (event) {
                const cursor = event.target.result;
                if (cursor) {
                    rows.push(cursor.value);
                    cursor.continue();
                } else {
                    resolve(sortByTime(rows));
                }
            };
            request.onerror = function () {
                reject(request.error || new Error("读取照片失败"));
            };
        });
    }

    /**
     * 本地库和本页内存合并。库只写出 1 张、后面几张还在内存时，拼图不能只用库里那一张。
     * @param {Array} dbRows
     * @param {Array} ramRows
     * @returns {Array}
     */
    function mergeRows(dbRows, ramRows) {
        const map = {};
        (dbRows || []).forEach(function (item) {
            if (item && item.id) {
                map[item.id] = item;
            }
        });
        (ramRows || []).forEach(function (item) {
            if (item && item.id) {
                map[item.id] = item;
            }
        });
        const merged = [];
        Object.keys(map).forEach(function (key) {
            merged.push(map[key]);
        });
        return sortByTime(merged);
    }

    /**
     * 写入一张已标注照片。先写本地库，成功才算记住。
     * @param {Object} photo
     * @returns {Promise<void>}
     */
    function savePhoto(photo) {
        rememberInRam(photo);
        return openDb()
            .then(function (db) {
                return new Promise(function (resolve, reject) {
                    const tx = db.transaction(STORE, "readwrite");
                    tx.oncomplete = function () {
                        persistWeak = false;
                        resolve();
                    };
                    tx.onerror = function () {
                        reject(tx.error || new Error("保存照片失败"));
                    };
                    tx.objectStore(STORE).put(photo);
                }).then(function () {
                    writeManifest(memoryRows);
                });
            })
            .catch(function () {
                persistWeak = true;
                writeManifest(memoryRows);
                return Promise.resolve();
            });
    }

    /**
     * 读取全部照片，按时间从旧到新。优先本地库，关掉再开也能读到。
     * @returns {Promise<Array>}
     */
    function listPhotos() {
        return openDb()
            .then(function (db) {
                return readAllFromDb(db).then(function (rows) {
                    const merged = mergeRows(rows, memoryRows);
                    if (merged.length) {
                        persistWeak = merged.length > rows.length;
                    }
                    writeManifest(merged);
                    return merged;
                });
            })
            .catch(function () {
                persistWeak = memoryRows.length > 0 || persistWeak;
                return sortByTime(memoryRows);
            });
    }

    /**
     * 按 id 删除一张。
     * @param {string} photoId
     * @returns {Promise<void>}
     */
    function deletePhoto(photoId) {
        for (let i = memoryRows.length - 1; i >= 0; i -= 1) {
            if (memoryRows[i].id === photoId) {
                memoryRows.splice(i, 1);
            }
        }
        return openDb()
            .then(function (db) {
                return new Promise(function (resolve, reject) {
                    const tx = db.transaction(STORE, "readwrite");
                    tx.oncomplete = function () {
                        resolve();
                    };
                    tx.onerror = function () {
                        reject(tx.error || new Error("删除照片失败"));
                    };
                    tx.objectStore(STORE).delete(photoId);
                }).then(function () {
                    writeManifest(memoryRows);
                });
            })
            .catch(function () {
                writeManifest(memoryRows);
                return Promise.resolve();
            });
    }

    /**
     * 清空全部缓存（只有用户点「清空」时才走这里）。
     * @returns {Promise<void>}
     */
    function clearAll() {
        memoryRows.length = 0;
        persistWeak = false;
        writeManifest([]);
        return openDb()
            .then(function (db) {
                return new Promise(function (resolve, reject) {
                    const tx = db.transaction(STORE, "readwrite");
                    tx.oncomplete = function () {
                        resolve();
                    };
                    tx.onerror = function () {
                        reject(tx.error || new Error("清空缓存失败"));
                    };
                    tx.objectStore(STORE).clear();
                });
            })
            .catch(function () {
                return Promise.resolve();
            });
    }

    /**
     * 读出上次未完成的批次号。读不到就返回空字符串。
     * @returns {string}
     */
    function loadOpenBatchId() {
        try {
            return localStorage.getItem(CONFIG.BATCH_KEY) || "";
        } catch (err) {
            return "";
        }
    }

    /**
     * 记住当前批次，下次打开还用这一批。
     * @param {string} batchId
     */
    function saveOpenBatchId(batchId) {
        try {
            if (batchId) {
                localStorage.setItem(CONFIG.BATCH_KEY, batchId);
            } else {
                localStorage.removeItem(CONFIG.BATCH_KEY);
            }
        } catch (err) {
            // 无痕模式可能写不了，忽略
        }
    }

    /**
     * 在已有照片里找回未拼完的批次：先看记住的号，再看最新一批没拼图的。
     * @param {Array} photos
     * @returns {string}
     */
    function resolveOpenBatchId(photos) {
        const rows = photos || [];
        const stored = loadOpenBatchId();
        const singlesOf = function (batchId) {
            return rows.filter(function (item) {
                return item.batchId === batchId && !item.isCollage;
            });
        };
        if (stored && singlesOf(stored).length) {
            return stored;
        }
        let latest = "";
        let latestAt = -1;
        rows.forEach(function (item) {
            if (item.isCollage) {
                return;
            }
            if ((item.createdAt || 0) >= latestAt) {

        function hasTextMark() {
            for (let i = 0; i < marks.length; i += 1) {
                if (marks[i].type === "text") {
                    return true;
                }
            }
            return false;
        }

        /**
         * 写了型号但没点照片时，自动贴到画面上方，少点一次。
         * @param {string} text
         * @returns {boolean}
         */
        function ensureSampleText(text) {
            if (hasTextMark()) {
                return true;
            }
            return addText(text, {
                x: image.naturalWidth * 0.16,
                y: image.naturalHeight * 0.3,
            });
        }

        function addText(text, point) {
            const value = (text || "").trim();
            if (!value) {
                return false;
            }
            marks.push({
                type: "text",
                x: point.x,
                y: point.y,
                text: value,
                color: color,
                fontSize: defaultFontSize(),
            });
            redraw();
            notifyMarksChanged();
            return true;
        }

        function setTool(nextTool) {
            tool = nextTool;
        }

        function setColor(nextColor) {
            color = nextColor;
        }

        function undo() {
            if (drawing) {
                drawing = null;
            } else {
                marks.pop();
            }
            redraw();
            notifyMarksChanged();
        }

        /**
         * 标注有变动，外面立刻把图存进本地库，不用等点「完成」。
         */
        function notifyMarksChanged() {
            canvas.dispatchEvent(new CustomEvent("marks-changed"));
        }

        /**
         * 按原图像素导出，文字和圈都会跟着原图放大，不二次压缩预览图。
         * @returns {string}
         */
        function exportDataUrl() {
            const out = document.createElement("canvas");
            out.width = image.naturalWidth;
            out.height = image.naturalHeight;
            const outCtx = out.getContext("2d");
            if (!outCtx) {
                throw new Error("导出画布失败");
            }
            // 1:1 贴原图，关闭平滑，避免导出时被二次模糊
            outCtx.imageSmoothingEnabled = false;
            outCtx.drawImage(image, 0, 0);
            marks.forEach(function (mark) {
                paintMark(outCtx, mark, 1);
            });
            return out.toDataURL("image/jpeg", CONFIG.JPEG_QUALITY);
        }

        function onPointerDown(event) {
            event.preventDefault();
            const point = toImagePoint(event.clientX, event.clientY);
            if (tool === "text") {
                canvas.dispatchEvent(
                    new CustomEvent("place-text", { detail: point })
                );
                return;
            }
            if (tool === "arrow") {
                drawing = {
                    type: "arrow",
                    x1: point.x,
                    y1: point.y,
                    x2: point.x,
                    y2: point.y,
                    color: color,
                    lineWidth: defaultLineWidth(),
                };
            } else if (tool === "circle") {
                drawing = {
                    type: "circle",
                    cx: point.x,
                    cy: point.y,
                    rx: 4,
                    ry: 4,
                    color: color,
                    lineWidth: defaultLineWidth(),
                    startX: point.x,
                    startY: point.y,
                };
            }
        }

        function onPointerMove(event) {
            if (!drawing) {
                return;
            }
            event.preventDefault();
            const point = toImagePoint(event.clientX, event.clientY);
            if (drawing.type === "arrow") {
                drawing.x2 = point.x;
                drawing.y2 = point.y;
            } else if (drawing.type === "circle") {
                drawing.rx = Math.abs(point.x - drawing.startX);
                drawing.ry = Math.abs(point.y - drawing.startY);
                drawing.cx = (point.x + drawing.startX) / 2;
                drawing.cy = (point.y + drawing.startY) / 2;
            }
            redraw();
        }

        function onPointerUp(event) {
            if (!drawing) {
                return;
            }
            event.preventDefault();
            marks.push(drawing);
            drawing = null;
            redraw();
            notifyMarksChanged();
        }

        canvas.addEventListener("pointerdown", onPointerDown);
        canvas.addEventListener("pointermove", onPointerMove);
        canvas.addEventListener("pointerup", onPointerUp);
        canvas.addEventListener("pointercancel", onPointerUp);
        window.addEventListener("resize", fitCanvas);
        fitCanvas();

        /**
         * 关掉本张编辑，避免下一张还叠着旧的触摸事件。
         */
        function destroy() {
            canvas.removeEventListener("pointerdown", onPointerDown);
            canvas.removeEventListener("pointermove", onPointerMove);
            canvas.removeEventListener("pointerup", onPointerUp);
            canvas.removeEventListener("pointercancel", onPointerUp);
            window.removeEventListener("resize", fitCanvas);
        }

        return {
            setTool: setTool,
            setColor: setColor,
            addText: addText,
            ensureSampleText: ensureSampleText,
            hasTextMark: hasTextMark,
            undo: undo,
            exportDataUrl: exportDataUrl,
            fitCanvas: fitCanvas,
            destroy: destroy,
            getTool: function () {
                return tool;
            },
        };
    }

    /**
     * 按最长边算出缩小后的宽高。不超过上限就不缩。
     * @param {number} width
     * @param {number} height
     * @param {number} maxEdge
     * @returns {{width: number, height: number, scale: number}}
     */
    function fitWithinMaxEdge(width, height, maxEdge) {
        const w = Math.max(1, width || 0);
        const h = Math.max(1, height || 0);
        const cap = Math.max(1, maxEdge || 1280);
        const longSide = Math.max(w, h);
        if (longSide <= cap) {
            return { width: w, height: h, scale: 1 };
        }
        const scale = cap / longSide;
        return {
            width: Math.max(1, Math.round(w * scale)),
            height: Math.max(1, Math.round(h * scale)),
            scale: scale,
        };
    }

    /**
     * 把画布压成 JPEG，再读回 Image。失败时把原因抛出去。
     * @param {HTMLCanvasElement} canvas
     * @param {number} quality
     * @returns {Promise<HTMLImageElement>}
     */
    function canvasToJpegImage(canvas, quality) {
        const q = typeof quality === "number" ? quality : CONFIG.JPEG_QUALITY;
        return new Promise(function (resolve, reject) {
            if (canvas.toBlob) {
                canvas.toBlob(
                    function (blob) {
                        if (!blob) {
                            reject(new Error("压缩照片失败"));
                            return;
                        }
                        loadByObjectUrl(blob).then(resolve).catch(reject);
                    },
                    "image/jpeg",
                    q
                );
                return;
            }
            try {
                const dataUrl = canvas.toDataURL("image/jpeg", q);
                if (!dataUrl || dataUrl.length < 100) {
                    reject(new Error("压缩照片失败"));
                    return;
                }
                const image = new Image();
                image.onload = function () {
                    if (!image.naturalWidth) {
                        reject(new Error("压缩后的照片是空的"));
                        return;
                    }
                    resolve(image);
                };
                image.onerror = function () {
                    reject(new Error("压缩后的照片打不开"));
                };
                image.src = dataUrl;
            } catch (err) {
                reject(err || new Error("压缩照片失败"));
            }
        });
    }

    /**
     * 单张图超过最长边就缩小，并按配置质量重压 JPEG。
     * 原图解码逻辑还在，这一步只是读入后立刻降内存。
     * @param {HTMLImageElement} image
     * @returns {Promise<HTMLImageElement>}
     */
    function shrinkImageIfNeeded(image) {
        if (!image || !image.naturalWidth || !image.naturalHeight) {
            return Promise.reject(new Error("照片读出来是空的，请重拍"));
        }
        const fit = fitWithinMaxEdge(
            image.naturalWidth,
            image.naturalHeight,
            CONFIG.PHOTO_MAX_EDGE
        );
        const canvas = document.createElement("canvas");
        canvas.width = fit.width;
        canvas.height = fit.height;
        const ctx = canvas.getContext("2d");
        if (!ctx) {
            return Promise.resolve(image);
        }
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(image, 0, 0, fit.width, fit.height);
        return canvasToJpegImage(canvas, CONFIG.JPEG_QUALITY).catch(function () {
            // 压缩失败不打断拍照，继续用已解码的图
            return image;
        });
    }

    /**
     * 用原文件直接解码成 Image（不再压一遍）。
     * @param {File} file
     * @returns {Promise<HTMLImageElement>}
     */
    function loadByObjectUrl(file) {
        return new Promise(function (resolve, reject) {
            const url = URL.createObjectURL(file);
            const image = new Image();
            image.onload = function () {
                URL.revokeObjectURL(url);
                if (!image.naturalWidth) {
                    reject(new Error("照片读出来是空的，请重拍"));
                    return;
                }
                resolve(image);
            };
            image.onerror = function () {
                URL.revokeObjectURL(url);
                reject(new Error("这张照片打不开，请换一张"));
            };
            image.src = url;
        });
    }

    /**
     * 少数浏览器会把 Image 缩得很小；用 Bitmap 兜底。
     * 画到画布时就按最长边缩小，避免先建一张超大原图像素。
     * @param {ImageBitmap} bitmap
     * @returns {Promise<HTMLImageElement>}
     */
    function imageFromBitmap(bitmap) {
        const fit = fitWithinMaxEdge(
            bitmap.width,
            bitmap.height,
            CONFIG.PHOTO_MAX_EDGE
        );
        const canvas = document.createElement("canvas");
        canvas.width = fit.width;
        canvas.height = fit.height;
        const ctx = canvas.getContext("2d");
        if (!ctx) {
            bitmap.close();
            return Promise.reject(new Error("无法按原像素解码"));
        }
        // 需要缩小时才开平滑；1:1 仍关闭，避免无谓模糊
        ctx.imageSmoothingEnabled = fit.scale < 1;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(bitmap, 0, 0, fit.width, fit.height);
        bitmap.close();
        return canvasToJpegImage(canvas, CONFIG.JPEG_QUALITY).catch(function () {
            return Promise.reject(new Error("原像素转存失败"));
        });
    }

    /**
     * 把文件读成 Image。先按原来的方式解码（必要时用 Bitmap 纠正方向），
     * 最后再缩到 PHOTO_MAX_EDGE，降低单张占用的内存。
     * @param {File} file
     * @returns {Promise<HTMLImageElement>}
     */
    function loadFileAsImage(file) {
        if (!file) {
            return Promise.reject(new Error("没有选到照片"));
        }
        return loadByObjectUrl(file)
            .then(function (image) {
                if (!window.createImageBitmap) {
                    return image;
                }
                return createImageBitmap(file, { imageOrientation: "from-image" })
                    .then(function (bitmap) {
                        const bigger =
                            bitmap.width > image.naturalWidth ||
                            bitmap.height > image.naturalHeight;
                        if (bigger) {
                            return imageFromBitmap(bitmap);
                        }
                        bitmap.close();
                        return image;
                    })
                    .catch(function () {
                        return image;
                    });
            })
            .then(shrinkImageIfNeeded);
    }

    global.PhotoEditor = {
        createEditor: createEditor,
        loadFileAsImage: loadFileAsImage,
    };
})(window);

/**

(function () {

    let currentEditId = "";

    let pendingCollageUrl = "";
    /** 拼图时已备好的下载清单，点保存时立刻下，不再等数据库 */
    let pendingSavePack = [];
    /** 拼图对应的单图 id，保存成功后再从缓存删掉 */

            window.requestAnimationFrame(function () {
                window.requestAnimationFrame(function () {
                    window.setTimeout(resolve, 40);
                });
            });
        });

    /**

     * @param {{ensureText?: boolean, quiet?: boolean}} [options]
     * @returns {Promise<void>}
     */
    function persistCurrentEdit(options) {
        const opt = options || {};
        if (!editor) {
            return Promise.resolve();
        }
        const sampleId = (els.textInput.value || "").trim();
        if (opt.ensureText && sampleId && editor.ensureSampleText) {
            editor.ensureSampleText(sampleId);
        }
        let dataUrl;
        try {
            dataUrl = editor.exportDataUrl();
        } catch (err) {
            logLine("导出失败：" + err.message);
            return Promise.reject(err);
        }
        if (!currentEditId) {
            currentEditId =
                "p-" + Date.now() + "-" + Math.random().toString(16).slice(2, 8);
            currentEditCreatedAt = Date.now();
        }
        const photo = {
            id: currentEditId,
            batchId: currentBatchId,
            sampleId: sampleId,
            dataUrl: dataUrl,
            createdAt: currentEditCreatedAt,
            isCollage: false,
        };
        return window.PhotoStorage.savePhoto(photo).then(function () {
            window.PhotoStorage.saveOpenBatchId(currentBatchId);
            if (!opt.quiet) {
                if (window.PhotoStorage.isPersistWeak()) {
                    showToast("这张没存住，关掉会丢。请用手机浏览器打开网上链接");
                } else {
                    showToast("已自动保存");
                }
            }
        });
    }

    /**

     */
    function schedulePersist() {
        clearTimeout(schedulePersist.timer);
        schedulePersist.timer = setTimeout(function () {
            persistCurrentEdit({ quiet: true }).catch(function (err) {
                logLine("自动保存失败：" + err.message);
            });
        }, 280);
    }

        clearTimeout(schedulePersist.timer);
        if (editor && editor.destroy) {

    /**
     * 把相册一次选出的多张放进队列。
     * @param {FileList|File[]} fileList
     */
    function enqueueAlbumFiles(fileList) {
        if (!fileList || !fileList.length) {
            return;
        }
        for (let i = 0; i < fileList.length; i += 1) {
            const item = fileList[i];
            if (item && item.type && item.type.indexOf("image/") === 0) {
                importQueue.push(item);
            } else if (item && !item.type) {
                // 少数浏览器不带 type，按图片试开
                importQueue.push(item);
            }
        }
        if (!importQueue.length) {
            logLine("没有选到图片");
            return;
        }
        logLine("已选 " + importQueue.length + " 张，将一张张标注");
        openNextQueuedFile();
    }

    /**
     * 取出队列下一张，沿用原来的单张标注。
     */
    function openNextQueuedFile() {
        if (!importQueue.length) {
            return;
        }
        if (pendingCollageUrl) {
            logLine("请先保存当前拼图，再继续标剩下的 " + importQueue.length + " 张");
            return;
        }
        const next = importQueue.shift();
        const left = importQueue.length;
        if (left) {
            logLine("还剩 " + left + " 张待标注");
        }
        openEditorWithFile(next, true);
    }

    /**

     * @param {Array} photos

    function pickOpenSingles(photos) {
        return (photos || []).filter(function (item) {
            return item && !item.isCollage && item.dataUrl;
        });
    }

    /**

     * @returns {Promise<Array>}

        return window.PhotoStorage.listPhotos().then(pickOpenSingles);
    }

    /**

                return getCurrentBatchPhotos();
            })
            .then(function (photos) {
                if (!photos.length) {
                    throw new Error("还没有已保存的细节图");
                }
                // 一页最多 9 张；多出来的等下一批，避免挤出画布
                const page = photos.slice(0, CONFIG.BATCH_SIZE);
                logLine(
                    (autoTrigger ? "已满 " + CONFIG.BATCH_SIZE + " 张，" : "提前") +
                        "开始拼图，共 " +
                        page.length +
                        " 张"
                );
                showToast("正在拼图，共 " + page.length + " 张", true);
                const urls = page.map(function (item) {
                    return item.dataUrl;
                });
                return window.PhotoCollage.buildCollage(urls).then(function (dataUrl) {
                    pendingCollageUrl = dataUrl;
                    pendingSavePack = [
                        {
                            dataUrl: dataUrl,
                            filename: "collage_" + currentBatchId + ".jpg",
                        },
                    ];
                    pendingSingleIds = [];
                    page.forEach(function (item, index) {
                        const name =
                            (item.sampleId || "sample") +
                            "_" +
                            currentBatchId +
                            "_" +
                            String(index + 1).padStart(2, "0") +
                            ".jpg";
                        pendingSavePack.push({ dataUrl: item.dataUrl, filename: name });
                        pendingSingleIds.push(item.id);
                    });
                    if (els.collagePreview) {
                        els.collagePreview.src = dataUrl;
                        els.collagePreview.alt = page.length + "张拼图";
                    }
                    if (els.collageCount) {
                        els.collageCount.textContent = "本页 " + page.length + " 张";
                    }
                    showView("collage");
                    logLine("拼图已生成，共 " + page.length + " 张，请点「保存拼图」");
                    showToast("已拼 " + page.length + " 张，请点「保存拼图」");
                    return page;
                });
            })
            .catch(function (err) {
                showToast("拼图失败：" + err.message);
                throw err;
            });
    }

    /**
     * 记住当前批次，闪退后再打开还能看到未拼完的图。
     * @param {string} batchId
     */
    function setCurrentBatch(batchId) {
        currentBatchId = batchId;
        window.PhotoStorage.saveOpenBatchId(batchId);
    }

    /**
     * 「完成」只是离开标注。图在打开时已经存过，这里再覆盖一次最新标注。
     */
    function saveEditedPhoto() {
        if (!editor) {
            logLine("没有正在编辑的照片");
            return;
        }
        els.btnSaveEdit.disabled = true;
        persistCurrentEdit({ ensureText: true })
            .then(function () {
                logLine("已更新本张，返回本批");
                return leaveEditor();
            })
            .then(function (batchPhotos) {
                if (batchPhotos.length >= CONFIG.BATCH_SIZE) {
                    return makeCollage(true);
                }
                openNextQueuedFile();
                return null;
            })
            .catch(function (err) {
                logLine("保存失败：" + err.message);
                showToast("没存住：" + err.message);
            })
            .then(function () {
                els.btnSaveEdit.disabled = false;
            });
    }

    /**
     * 拼图后把拼图和本批单图存到手机。
     * 单图仍留在本批，只有用户点「清空」才删除。
     */
    function saveCollageAndRotateBatch() {
        if (!pendingCollageUrl || !pendingSavePack.length) {
            logLine("没有待保存的拼图");
            return Promise.resolve();
        }
        const collageUrl = pendingCollageUrl;
        const pack = pendingSavePack.slice();
        const record = {
            id: "c-" + Date.now(),
            batchId: currentBatchId,
            sampleId: "拼图",
            dataUrl: collageUrl,
            createdAt: Date.now(),
            isCollage: true,
        };

        els.btnSaveCollage.disabled = true;
        // 立刻开始保存，保留这次点击手势，避免浏览器拦截分享/下载
        return window.PhotoSave.saveManyToPhone(pack)
            .then(function (result) {
                return window.PhotoStorage.savePhoto(record).then(function () {
                    return result;
                });
            })
            .then(function (result) {
                const singleCount = Math.max(0, pack.length - 1);
                const method = result && result.method;
                if (method === "share") {
                    logLine(
                        "已用系统分享一次保存拼图和 " + singleCount + " 张单图，照片仍留在本批"
                    );
                    showToast("请在面板里选存储图像，一次能存全部");
                } else {
                    logLine("已开始下载拼图和 " + singleCount + " 张单图，照片仍留在本批");
                    showToast("已开始下载拼图和单图，照片还在，要点清空才删");
                    if (window.PhotoSave.isIOS()) {
                        showSaveSheet(collageUrl);
                    }
                }
                pendingCollageUrl = "";
                pendingSavePack = [];
                pendingSingleIds = [];
                showView("home");
                return refreshHome();
            })
            .then(function () {
                openNextQueuedFile();
            })
            .catch(function (err) {
                logLine("拼图保存失败：" + err.message);
                showToast("还没存下，照片还在，请再点一次保存");
            })
            .then(function () {
                els.btnSaveCollage.disabled = false;
            });
    }

    function bindEvents() {
        els.fileShot.addEventListener("change", function () {
            const file = els.fileShot.files && els.fileShot.files[0];
            els.fileShot.value = "";
            if (file) {
                openEditorWithFile(file, false);
            }
        });
        els.fileAlbum.addEventListener("change", function () {
            const picked = els.fileAlbum.files;
            enqueueAlbumFiles(picked);
            els.fileAlbum.value = "";
        });

        els.toolText.addEventListener("click", function () {
            setToolActive("text");
        });
        els.toolArrow.addEventListener("click", function () {
            setToolActive("arrow");
        });
        els.toolCircle.addEventListener("click", function () {
            setToolActive("circle");
        });
        els.btnUndo.addEventListener("click", function () {
            if (editor) {
                editor.undo();
            }
        });
        els.btnCancelEdit.addEventListener("click", function () {
            persistCurrentEdit({ quiet: true })
                .catch(function () {
                    return null;
                })
                .then(function () {
                    logLine("已返回，这张早就自动保存了");
                    return leaveEditor();
                })
                .then(function () {
                    openNextQueuedFile();
                });
        });
        els.btnSaveEdit.addEventListener("click", saveEditedPhoto);
        els.editorCanvas.addEventListener("marks-changed", function () {
            schedulePersist();
        });
        els.textInput.addEventListener("change", function () {
            schedulePersist();
        });

        els.editorCanvas.addEventListener("place-text", function (event) {
            if (!editor) {
                return;
            }
            const ok = editor.addText(els.textInput.value, event.detail);
            if (!ok) {
                logLine("请先在上方输入型号，再点照片贴上去");
                els.textInput.focus();
            }
        });

        els.colorRow.addEventListener("click", function (event) {
            const btn = event.target.closest("[data-color]");
            if (!btn) {
                return;
            }
            const color = btn.getAttribute("data-color");
            Array.prototype.forEach.call(els.colorRow.children, function (item) {
                item.classList.toggle("is-active", item === btn);
            });
            if (editor) {
                editor.setColor(color);
            }
        });

        els.btnEarlyCollage.addEventListener("click", function () {
            makeCollage(false).catch(function (err) {
                logLine("拼图失败：" + err.message);
            });
        });
        els.btnSaveCollage.addEventListener("click", saveCollageAndRotateBatch);
        els.btnBackHome.addEventListener("click", function () {
            pendingCollageUrl = "";
            pendingSavePack = [];
            pendingSingleIds = [];
            showView("home");
            openNextQueuedFile();
        });
        els.btnCloseSheet.addEventListener("click", function () {
            els.saveSheet.hidden = true;
            els.saveSheetImg.src = "";
        });
        els.btnClear.addEventListener("click", function () {
            if (!window.confirm("清空本机缓存的全部细节图和拼图？相册里已保存的不会删。")) {
                return;
            }
            window.PhotoStorage.clearAll()
                .then(function () {
                    setCurrentBatch(window.PhotoStorage.makeBatchId());
                    logLine("缓存已清空");
                    return refreshHome();
                })
                .catch(function (err) {
                    logLine("清空失败：" + err.message);
                });
        });
    }

    function isHomeScreen() {
        return (
            window.navigator.standalone === true ||
            window.matchMedia("(display-mode: standalone)").matches
        );
    }

    function boot() {
        if (window.PhotoSave.isWeChat()) {
            els.wechatBar.hidden = false;
        }
        if (els.chromeBar && window.PhotoSave.isChrome()) {
            els.chromeBar.hidden = false;
        }
        if (els.iosBar && window.PhotoSave.isIOS() && !isHomeScreen()) {
            els.iosBar.hidden = false;
        }
        bindEvents();
        setToolActive("text");
        showView("home");
        if (window.PhotoStorage.requestPersist) {
            window.PhotoStorage.requestPersist();
        }
        window.PhotoStorage.listPhotos()
            .then(function (photos) {
                setCurrentBatch(window.PhotoStorage.resolveOpenBatchId(photos));
                const leftover = pickOpenSingles(photos);
                if (leftover.length) {
                    logLine("已恢复未完成批次，共 " + leftover.length + " 张");
                    showToast("已恢复 " + leftover.length + " 张，关掉也会留着");
                } else if (
                    window.PhotoStorage.readManifestCount &&
                    window.PhotoStorage.readManifestCount() > 0
                ) {
                    logLine("本地库是空的，但上次记过有图");
                    showToast("上次的图被浏览器清掉了，不要用无痕或微信");
                } else {
                    logLine("新批次 " + currentBatchId + "。完成会记住，关掉再开还在");
                }
                return refreshHome();
            })
            .catch(function (err) {
                logLine("初始化失败：" + err.message);
            });
        window.addEventListener("pageshow", function () {
            refreshHome();
        });
        window.addEventListener("pagehide", function () {
            if (editor) {
                persistCurrentEdit({ quiet: true, ensureText: true });
            }
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
    } else {
        boot();
    }
})();

</script>
</body>
</html>
